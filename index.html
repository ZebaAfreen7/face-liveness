<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriLive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>VeriLive</h1>
  <p id="status">Starting camera...</p>

  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="stats">
    <div>Blinks: <strong id="blink-count">0</strong></div>
    <div>EAR: <strong id="ear-value">–</strong></div>
    <div>Eyes: <strong id="eye-state">–</strong></div>
    <div>Turn: <strong id="turn-value">–</strong></div>
    <div>Direction: <strong id="turn-direction">–</strong></div>
  </div>

  <div class="challenge">
    <button id="challenge-btn">Start head-turn challenge</button>
    <p id="challenge-text">Press the button to start.</p>
  </div>

  <script src="js/camera.js"></script>
  <script type="module" src="js/face.js"></script>
</body>
</html>
